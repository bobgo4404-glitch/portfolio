<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정지원 | HR &amp; DX 전문가 포트폴리오</title>
    <meta name="description" content="인사/총무 12년 경력에 개발 역량을 결합한 HR·DX 전문가 정지원의 포트폴리오. React, Firebase 기반 업무 자동화 도구 20개 이상 직접 개발·운영.">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="정지원 | HR &amp; DX 전문가 포트폴리오">
    <meta property="og:description" content="인사/총무 12년 경력에 개발 역량을 결합한 HR·DX 전문가 정지원의 포트폴리오.">
    <meta property="og:locale" content="ko_KR">
    
    <!-- 1. Fonts: Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 2. Icons: FontAwesome (Replacing Lucide for Standalone stability) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- 3. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- 4. React & ReactDOM (Production) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- 5. Babel Standalone (v7.23.5 - Mandatory) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f5f5fb; }
        ::-webkit-scrollbar-thumb { background: #c4c2e8; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9896cc; }

        html { scroll-behavior: smooth; }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.25; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(1.05); }
        }

        /* Hero — 정적인 세련된 배경 */
        .hero-gradient {
            background: linear-gradient(150deg, #ffffff 0%, #f5f3ff 45%, #eef2ff 100%);
        }

        /* Glow orb — 더 부드럽게 */
        .glow-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(72px);
            animation: glowPulse 9s ease-in-out infinite;
        }

        /* Card hover — spring 느낌 + indigo shadow */
        .card-lift {
            transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.35s ease, border-color 0.3s ease;
        }
        .card-lift:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 48px rgba(79, 70, 229, 0.13), 0 2px 8px rgba(0,0,0,0.04);
            border-color: rgba(165, 180, 252, 0.55);
        }

        /* Timeline */
        .timeline-glow {
            position: absolute;
            left: 50%;
            top: 6rem;
            bottom: 2rem;
            width: 2px;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, transparent, rgba(99, 102, 241, 0.4), transparent);
            z-index: 0;
            display: none;
        }
        @media (min-width: 768px) { .timeline-glow { display: block; } }

        /* Experience section bg */
        .exp-bg-accent {
            background:
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.06) 0, transparent 42%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.06) 0, transparent 42%),
                linear-gradient(to bottom, #f8f8ff 0%, #f3f4fb 100%);
        }

        /* Scroll reveal */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: var(--reveal-delay, 0ms);
        }
        .reveal.show { opacity: 1; transform: translateY(0); }

        /* Hero 도트 그리드 패턴 */
        .dot-grid {
            background-image: radial-gradient(circle, rgba(99,102,241,0.13) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* DX 다크 그리드 라인 */
        .grid-lines-dark {
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 52px 52px;
        }

        /* 섹션 웨이브 구분선 */
        .section-wave { display: block; width: 100%; }

        /* Expertise 카드 상단 컬러 바 */
        .card-accent-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 1rem 1rem 0 0;
        }

        /* Experience 카드 왼쪽 accent */
        .desc-border { border-left: 2px solid rgba(99,102,241,0.25); }
    </style>
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Components ---

        const Navigation = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const mobileMenuId = "mobile-nav-menu";

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 20);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const onKeyDown = (e) => {
                    if (e.key === "Escape") setIsOpen(false);
                };
                window.addEventListener("keydown", onKeyDown);
                return () => window.removeEventListener("keydown", onKeyDown);
            }, []);

            const navLinks = [
                { name: '요약', href: '#summary' },
                { name: 'DX 역량', href: '#dx' },
                { name: '경력', href: '#experience' },
                { name: '전문성', href: '#expertise' },
            ];

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-xl shadow-[0_1px_0_rgba(99,102,241,0.08)] py-3' : 'bg-transparent py-5'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <a href="#" className="inline-flex items-center gap-2 hover:opacity-70 transition-opacity" aria-label="홈으로 이동">
                            <span className="text-slate-900 font-black tracking-tight text-xl">정지원</span>
                            <span className="w-px h-4 bg-slate-300"></span>
                            <span className="text-indigo-600 font-semibold text-sm tracking-wide">Portfolio</span>
                        </a>

                        {/* Desktop Menu */}
                        <div className="hidden md:flex space-x-8">
                            {navLinks.map((link) => (
                                <a key={link.name} href={link.href} className="text-slate-500 hover:text-indigo-600 font-semibold transition-colors text-sm tracking-wide">
                                    {link.name}
                                </a>
                            ))}
                        </div>

                        {/* Mobile Menu Button */}
                        <div className="md:hidden">
                            <button
                                onClick={() => setIsOpen(!isOpen)}
                                className="text-slate-800 focus:outline-none p-2"
                                aria-label={isOpen ? "모바일 메뉴 닫기" : "모바일 메뉴 열기"}
                                aria-expanded={isOpen}
                                aria-controls={mobileMenuId}
                                type="button"
                            >
                                {isOpen ? <i className="fa-solid fa-times text-2xl"></i> : <i className="fa-solid fa-bars text-2xl"></i>}
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    <div
                        id={mobileMenuId}
                        className={`md:hidden absolute top-full left-0 w-full bg-white shadow-lg border-t border-slate-100 py-4 px-6 flex flex-col space-y-4 ${isOpen ? '' : 'hidden'}`}
                        aria-hidden={!isOpen}
                    >
                        {navLinks.map((link) => (
                            <a
                                key={link.name}
                                href={link.href}
                                className="text-slate-600 font-medium py-2 border-b border-slate-50 last:border-0"
                                onClick={() => setIsOpen(false)}
                                tabIndex={isOpen ? 0 : -1}
                            >
                                {link.name}
                            </a>
                        ))}
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section id="summary" className="relative min-h-[90vh] flex items-center pt-20 pb-24 hero-gradient overflow-hidden">
                    {/* 도트 그리드 패턴 오버레이 */}
                    <div className="absolute inset-0 dot-grid opacity-60" aria-hidden="true"></div>
                    {/* 오른쪽 사선 패널 */}
                    <div className="absolute top-0 right-0 w-5/12 h-full bg-indigo-50/60 skew-x-[-10deg] transform origin-top translate-x-24 hidden md:block" aria-hidden="true"></div>
                    <div className="glow-orb w-72 h-72 bg-indigo-200/45 top-16 -left-16" aria-hidden="true"></div>
                    <div className="glow-orb w-96 h-96 bg-violet-200/35 bottom-0 right-0" aria-hidden="true" style={{ animationDelay: '2s' }}></div>
                    
                    <div className="container mx-auto px-6 relative z-10">
                        <div className="max-w-5xl mx-auto">
                            <div className="flex flex-col md:flex-row items-center gap-12">
                                <div className="flex-1 text-center md:text-left">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100 text-xs font-semibold uppercase tracking-wider mb-6 reveal" data-reveal style={{ '--reveal-delay': '40ms' }}>
                                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></span>
                                        구직 중 · Available
                                    </div>
                                    
                                    <h1 className="text-4xl md:text-6xl font-bold text-slate-900 leading-tight mb-6 reveal" data-reveal style={{ '--reveal-delay': '100ms' }}>
                                        데이터로 인사이트를 찾고<br />
                                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-violet-600">기술로 업무를 혁신하는</span><br />
                                        HR & GA 전문가입니다.
                                    </h1>
                                    
                                    <p className="text-lg text-slate-600 mb-8 leading-relaxed max-w-2xl mx-auto md:mx-0 reveal" data-reveal style={{ '--reveal-delay': '160ms' }}>
                                        인사/총무 11년 실무 경험에 개발 역량을 결합해,
                                        <strong className="text-slate-900"> 반복 행정을 자동화하고 실행 가능한 시스템</strong>으로 전환합니다.
                                    </p>

                                    <div className="flex flex-wrap justify-center md:justify-start gap-4 reveal" data-reveal style={{ '--reveal-delay': '220ms' }}>
                                        {/* 이력서 다운로드 대신 실용적인 이메일 문의하기로 변경 */}
                                        <a href="mailto:bobgo9@naver.com" className="px-8 py-4 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-all flex items-center gap-2 shadow-lg shadow-indigo-200 hover:shadow-xl hover:shadow-indigo-200 hover:-translate-y-1">
                                            <i className="fa-solid fa-envelope text-lg"></i>
                                            이메일 문의하기
                                        </a>
                                        <a href="#dx" className="px-8 py-4 bg-white text-slate-600 border border-slate-200 rounded-xl font-semibold hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-700 hover:shadow-md hover:-translate-y-1 transition-all flex items-center gap-2">
                                            <i className="fa-solid fa-briefcase text-lg"></i>
                                            업무 혁신 사례 보기
                                        </a>
                                    </div>
                                </div>

                                {/* Right Side Stats Card */}
                                <div className="w-full md:w-80 bg-white p-6 rounded-2xl shadow-[0_4px_24px_rgba(79,70,229,0.1),0_1px_4px_rgba(0,0,0,0.04)] border border-indigo-50 relative mt-10 md:mt-0 card-lift reveal" data-reveal style={{ '--reveal-delay': '260ms' }}>
                                    <div className="absolute -top-4 -right-4 w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 shadow-sm">
                                        <i className="fa-solid fa-award text-3xl"></i>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-800 mb-6 border-b pb-2">핵심 요약</h3>
                                    <div className="space-y-4">
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-slate-100 rounded-lg w-10 h-10 flex items-center justify-center">
                                                <i className="fa-solid fa-briefcase text-slate-600"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">총 경력</p>
                                                <p className="text-lg font-bold text-slate-900">11년 이상</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-green-100 rounded-lg w-10 h-10 flex items-center justify-center">
                                                <i className="fa-solid fa-user-shield text-green-600"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">자격증</p>
                                                <p className="text-sm font-bold text-slate-900">ISO 14001 심사원</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-indigo-100 rounded-lg w-10 h-10 flex items-center justify-center">
                                                <i className="fa-solid fa-code text-indigo-600"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">기술 스택</p>
                                                <p className="text-sm font-bold text-slate-900">React, Firebase, HTML/CSS</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="p-2 bg-pink-100 rounded-lg w-10 h-10 flex items-center justify-center">
                                                <i className="fa-solid fa-heart text-pink-600"></i>
                                            </div>
                                            <div>
                                                <p className="text-xs text-slate-500 font-semibold uppercase">취미/특기</p>
                                                <p className="text-sm font-bold text-slate-900 leading-snug break-keep">영상 편집 (CapCut · Final Cut Pro · Filmora), 업무 자동화 툴 기획</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* 하단 웨이브 — DX 섹션으로 부드럽게 연결 */}
                    <div className="absolute bottom-0 left-0 w-full overflow-hidden" style={{ lineHeight: 0 }} aria-hidden="true">
                        <svg viewBox="0 0 1440 56" preserveAspectRatio="none" className="section-wave" style={{ height: '56px' }}>
                            <path d="M0,28 C240,56 480,0 720,28 C960,56 1200,0 1440,28 L1440,56 L0,56 Z" fill="#0c0b1a"/>
                        </svg>
                    </div>
                </section>
            );
        };

        const DxCapability = () => {
            return (
                <section id="dx" className="relative py-24 pb-32 bg-[#0c0b1a] text-white overflow-hidden">
                    {/* 다크 그리드 라인 패턴 */}
                    <div className="absolute inset-0 grid-lines-dark" aria-hidden="true"></div>
                    <div className="container mx-auto px-6 relative z-10">
                        <div className="flex flex-col md:flex-row items-start md:items-end justify-between mb-12">
                            <div>
                                <span className="text-cyan-300 font-bold tracking-wider text-sm uppercase">강점 (Differentiator)</span>
                                <h2 className="text-3xl md:text-4xl font-bold mt-2">IT 기반 업무 자동화 (DX)</h2>
                                <p className="text-slate-400 mt-4 max-w-xl">
                                    반복 업무를 자동화해 실행 시간을 줄이고, 
                                    실무자가 바로 쓰는 도구를 직접 기획·개발합니다.
                                </p>
                            </div>
                            <div className="mt-6 md:mt-0 flex gap-2">
                                <span className="px-3 py-1 bg-white/8 rounded-full text-xs font-mono text-cyan-300 border border-white/15">React.js</span>
                                <span className="px-3 py-1 bg-white/8 rounded-full text-xs font-mono text-yellow-300 border border-white/15">Firebase</span>
                                <span className="px-3 py-1 bg-white/8 rounded-full text-xs font-mono text-orange-300 border border-white/15">HTML5/CSS3</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                            <div className="bg-white/5 border border-white/10 rounded-xl p-4 reveal card-lift" data-reveal style={{ '--reveal-delay': '40ms' }}>
                                <p className="text-xs text-cyan-300 font-bold uppercase tracking-wider mb-1">자동화 도구</p>
                                <p className="text-2xl font-extrabold text-white">20+</p>
                                <p className="text-xs text-slate-400 mt-1">직접 기획 및 개발/운영</p>
                                <p className="text-[11px] text-slate-500 mt-1.5 leading-relaxed">
                                    예: 인사/급여/명세 자동화, 경조사·고정자산·교육 이수 관리, 공지문·보안점검 리포트 생성, 주간 운영 대시보드
                                </p>
                            </div>
                            <div className="bg-white/5 border border-white/10 rounded-xl p-4 reveal card-lift" data-reveal style={{ '--reveal-delay': '110ms' }}>
                                <p className="text-xs text-cyan-300 font-bold uppercase tracking-wider mb-1">업무 처리시간</p>
                                <p className="text-2xl font-extrabold text-white">최대 70%</p>
                                <p className="text-xs text-slate-400 mt-1">문서/집계 프로세스 단축</p>
                            </div>
                            <div className="bg-white/5 border border-white/10 rounded-xl p-4 reveal card-lift" data-reveal style={{ '--reveal-delay': '180ms' }}>
                                <p className="text-xs text-cyan-300 font-bold uppercase tracking-wider mb-1">휴먼 에러</p>
                                <p className="text-2xl font-extrabold text-white">대폭 감소</p>
                                <p className="text-xs text-slate-400 mt-1">반복 입력/포맷 오류 최소화</p>
                            </div>
                        </div>

                        <div className="mb-10 reveal" data-reveal style={{ '--reveal-delay': '220ms' }}>
                            <p className="text-xs text-cyan-300 font-bold uppercase tracking-wider mb-3">대표 제작 앱 7선</p>
                            <div className="flex flex-wrap gap-2">
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">경조사 관리대장</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">고정자산 관리대장</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">교육 이수현황 보고</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">주간메뉴표 운영앱</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">보안점검 리포트 생성기</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">라이센스 관리대장</span>
                                <span className="px-3 py-1.5 rounded-full bg-white/8 border border-white/15 text-xs text-slate-300 hover:bg-white/15 transition-colors">인건비 전략 대시보드</span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white/5 p-8 rounded-2xl border border-white/10 hover:border-cyan-400/60 transition-colors group card-lift reveal" data-reveal style={{ '--reveal-delay': '70ms' }}>
                                <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-6 group-hover:bg-cyan-500/80 transition-colors">
                                    <i className="fa-solid fa-microchip text-2xl"></i>
                                </div>
                                <h3 className="text-xl font-bold mb-3">실무 맞춤형 솔루션 개발</h3>
                                <p className="text-slate-400 text-sm leading-relaxed mb-4">
                                    주간 플래너, 급여 계산기 등 현업의 병목 지점을 해소하는 도구를 직접 개발해 운영했습니다.
                                </p>
                            </div>
                            
                            <div className="bg-white/5 p-8 rounded-2xl border border-white/10 hover:border-cyan-400/60 transition-colors group card-lift reveal" data-reveal style={{ '--reveal-delay': '140ms' }}>
                                <div className="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center mb-6 group-hover:bg-cyan-500/80 transition-colors">
                                    <i className="fa-solid fa-file-circle-check text-2xl"></i>

        const App = () => {
            useEffect(() => {
                const nodes = document.querySelectorAll("[data-reveal]");
                if (!nodes.length) return;

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("show");
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });

                nodes.forEach((node, idx) => {
                    if (!node.style.getPropertyValue("--reveal-delay")) {
                        node.style.setProperty("--reveal-delay", `${Math.min(idx * 35, 260)}ms`);

                });

                return () => observer.disconnect();
